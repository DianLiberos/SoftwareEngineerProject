name: BrewLite CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-test-and-build:
    name: Backend CI (NestJS + Prisma + Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/brewlite?schema=public"
      JWT_SECRET: "ci-dummy-secret-key"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/api/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Unit Tests (Task 10 & 5.2 - State Machine, Inventory, Idempotency)
        run: npm test -- --coverage

      - name: Type-Check TypeScript
        run: npx tsc --noEmit

      - name: Build NestJS Application
        run: npm run build

  frontend-test-and-build:
    name: Frontend CI (Next.js 16 + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_API_URL: "http://localhost:3001"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Next.js Types
        run: npx next typegen

      - name: Type-Check TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build
